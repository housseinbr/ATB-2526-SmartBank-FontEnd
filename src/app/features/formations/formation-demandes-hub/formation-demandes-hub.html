<div class="formation-demandes-hub">
  @if (canManage()) {
    <app-formation-requests />
  } @else {
    <section class="hero-card">
      <div class="hero-card__content">
        <p class="eyebrow">Espace demandes</p>
        <h1 class="page-title">Demandes de formation</h1>
        <p class="hero-card__subtitle">{{ heroSubtitle() }}</p>
      </div>

      <div class="hero-card__meta">
        <span class="role-badge">{{ heroLabel() }}</span>
        <span class="hero-card__hint">Suivi simplifie des decisions</span>
      </div>
    </section>

    <app-my-formations />
  }
</div>
