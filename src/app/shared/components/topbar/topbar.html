<header class="topbar">
  <div class="topbar__left">
    <div class="topbar__title-group">
      <h1 class="topbar__title">{{ pageTitle() }}</h1>
      <span class="topbar__role-chip">{{ roleLabel }}</span>
    </div>
  </div>

  <div class="topbar__right">
    <div class="topbar__search">
      <app-icon name="search" [size]="14" />
      <input
        type="text"
        placeholder="Rechercher..."
        [value]="searchValue"
        (input)="onSearch($event)"
      />
    </div>

    <div class="topbar__notifications">
      <app-icon name="bell" [size]="18" />
      <span class="topbar__notifications-badge">2</span>
    </div>

    <div class="topbar__profile-wrapper">
      <div class="topbar__profile" (click)="toggleProfileMenu()">
        <div class="topbar__profile-avatar">{{ initials }}</div>
        <div class="topbar__profile-info">
          <span class="topbar__profile-name">{{ fullName }}</span>
          <span class="topbar__profile-email">{{ user()?.email }}</span>
        </div>
        <app-icon
          class="topbar__profile-chevron"
          [class.topbar__profile-chevron--open]="isProfileMenuOpen"
          name="chevron-down"
          [size]="14"
        />
      </div>

      @if (isProfileMenuOpen) {
        <div class="topbar__profile-dropdown">
          <button type="button" class="topbar__profile-dropdown-item" (click)="goToProfile()">
            <app-icon name="user" [size]="14" />
            <span>Profil</span>
          </button>
          <div class="topbar__profile-dropdown-divider"></div>
          <button
            type="button"
            class="topbar__profile-dropdown-item topbar__profile-dropdown-item--danger"
            (click)="logout()"
          >
            <app-icon name="log-out" [size]="14" />
            <span>Déconnexion</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
